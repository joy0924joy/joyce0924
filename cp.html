<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>12人CP连线 · 清晰红线版</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  width: 100vw;
  width: 100dvw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #f5f5f7;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

.wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

#lineCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.avatar {
  position: absolute;
  z-index: 2;
  cursor: pointer;
  width: 120px;
  touch-action: manipulation;
}

.avatar .photo {
  width: 120px;
  height: 160px;
  border-radius: 20px;
  overflow: hidden;
  border: 4px solid #fff;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
  background: #eee;
}

.avatar .photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.avatar .name {
  margin-top: 8px;
  text-align: center;
  font-size: 15px;
  font-weight: 800;
  color: #222;
}

.avatar.active .photo {
  border-color: #ff4d7e;
  box-shadow: 0 0 0 5px rgba(255, 77, 126, 0.28);
}

/* 顶部 4 人 */
.top-1 { top: 28px; left: calc(50% - 250px); }
.top-2 { top: 28px; left: calc(50% - 125px); }
.top-3 { top: 28px; left: calc(50% + 0px); }
.top-4 { top: 28px; left: calc(50% + 125px); }

/* 底部 4 人 */
.bottom-1 { bottom: 90px; left: calc(50% - 250px); }
.bottom-2 { bottom: 90px; left: calc(50% - 125px); }
.bottom-3 { bottom: 90px; left: calc(50% + 0px); }
.bottom-4 { bottom: 90px; left: calc(50% + 125px); }

/* 左侧 2 人 */
.left-1 { top: 50%; left: 28px; transform: translateY(-115%); }
.left-2 { top: 50%; left: 28px; transform: translateY(5%); }

/* 右侧 2 人 */
.right-1 { top: 50%; right: 28px; transform: translateY(-115%); }
.right-2 { top: 50%; right: 28px; transform: translateY(5%); }

.controls {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
}

button {
  border: none;
  border-radius: 999px;
  padding: 11px 18px;
  background: #222;
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

button.secondary {
  background: #888;
}

/* 手机端适配：缩小间距并重新安排左右两列 */
@media (max-width: 720px) {
  .avatar {
    width: 90px;
  }

  .avatar .photo {
    width: 90px;
    height: 120px;
    border-radius: 16px;
    border-width: 3px;
  }

  .avatar .name {
    font-size: 13px;
  }

  .top-1 { top: 24px; left: calc(50% - 190px); }
  .top-2 { top: 24px; left: calc(50% - 95px); }
  .top-3 { top: 24px; left: calc(50% + 0px); }
  .top-4 { top: 24px; left: calc(50% + 95px); }

  .bottom-1 { bottom: 90px; left: calc(50% - 190px); }
  .bottom-2 { bottom: 90px; left: calc(50% - 95px); }
  .bottom-3 { bottom: 90px; left: calc(50% + 0px); }
  .bottom-4 { bottom: 90px; left: calc(50% + 95px); }

  .left-1 { top: 46%; left: 14px; transform: translateY(-110%); }
  .left-2 { top: 54%; left: 14px; transform: translateY(-10%); }

  .right-1 { top: 46%; right: 14px; transform: translateY(-110%); }
  .right-2 { top: 54%; right: 14px; transform: translateY(-10%); }
}
</style>
</head>
<body>

<div class="wrapper">
  <canvas id="lineCanvas"></canvas>

  <!-- 顶部 4 人 -->
  <div class="avatar top-1" data-name="T1">
    <div class="photo"><img src="https://img.remit.ee/i/s7jGBRUe5lCB" alt=""></div>
    <div class="name">T1</div>
  </div>
  <div class="avatar top-2" data-name="T2">
    <div class="photo"><img src="https://img.remit.ee/i/p4lehqRw3WAa" alt=""></div>
    <div class="name">T2</div>
  </div>
  <div class="avatar top-3" data-name="T3">
    <div class="photo"><img src="https://img.remit.ee/i/xCyKu2b9t8s3" alt=""></div>
    <div class="name">T3</div>
  </div>
  <div class="avatar top-4" data-name="T4">
    <div class="photo"><img src="https://img.remit.ee/i/QWcrHCSdVik7" alt=""></div>
    <div class="name">T4</div>
  </div>

  <!-- 底部 4 人 -->
  <div class="avatar bottom-1" data-name="B1">
    <div class="photo"><img src="https://img.remit.ee/i/BWGG9zYGTip1" alt=""></div>
    <div class="name">B1</div>
  </div>
  <div class="avatar bottom-2" data-name="B2">
    <div class="photo"><img src="https://img.remit.ee/i/5TRuND66j7LC" alt=""></div>
    <div class="name">B2</div>
  </div>
  <div class="avatar bottom-3" data-name="B3">
    <div class="photo"><img src="https://img.remit.ee/i/6vE6IboMuLBo" alt=""></div>
    <div class="name">B3</div>
  </div>
  <div class="avatar bottom-4" data-name="B4">
    <div class="photo"><img src="https://img.remit.ee/i/kovtpD1DEbbv" alt=""></div>
    <div class="name">B4</div>
  </div>

  <!-- 左侧 2 人 -->
  <div class="avatar left-1" data-name="L1">
    <div class="photo"><img src="https://img.remit.ee/i/soeXz0hldTSn" alt=""></div>
    <div class="name">L1</div>
  </div>
  <div class="avatar left-2" data-name="L2">
    <div class="photo"><img src="https://img.remit.ee/i/qh7hSZImLb0g" alt=""></div>
    <div class="name">L2</div>
  </div>

  <!-- 右侧 2 人 -->
  <div class="avatar right-1" data-name="R1">
    <div class="photo"><img src="https://img.remit.ee/i/6y6BRwzaeUgD" alt=""></div>
    <div class="name">R1</div>
  </div>
  <div class="avatar right-2" data-name="R2">
    <div class="photo"><img src="https://img.remit.ee/i/bXOE11JSbKQl" alt=""></div>
    <div class="name">R2</div>
  </div>

  <div class="controls">
    <button id="clearBtn">清空连线</button>
    <button id="exportBtn">导出截图</button>
    <button id="resetBtn" class="secondary">重置全部</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const canvas = document.getElementById('lineCanvas');
const ctx = canvas.getContext('2d');
const avatars = document.querySelectorAll('.avatar');

let selected = null;
let lines = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  redrawLines();
}

function getCenter(el) {
  const rect = el.getBoundingClientRect();
  return {
    x: rect.left + rect.width / 2,
    y: rect.top + rect.height / 2
  };
}

// 强制经过中央空白区的贝塞尔曲线
function getCentralControlPoint(p1, p2) {
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  const midX = (p1.x + p2.x) / 2;
  const midY = (p1.y + p2.y) / 2;

  // 向中央空白区牵引
  const pullX = (centerX - midX) * 0.55;
  const pullY = (centerY - midY) * 0.55;

  return {
    x: midX + pullX,
    y: midY + pullY
  };
}

// 绘制单条带白色描边的红线
function drawRedLine(p1, p2) {
  const control = getCentralControlPoint(p1, p2);

  // 白色外描边
  ctx.beginPath();
  ctx.lineWidth = 12;
  ctx.strokeStyle = '#ffffff';
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = 2;
  ctx.moveTo(p1.x, p1.y);
  ctx.quadraticCurveTo(control.x, control.y, p2.x, p2.y);
  ctx.stroke();

  // 红色主线
  ctx.beginPath();
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#e60033';
  ctx.shadowColor = 'rgba(230, 0, 51, 0.55)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 2;
  ctx.moveTo(p1.x, p1.y);
  ctx.quadraticCurveTo(control.x, control.y, p2.x, p2.y);
  ctx.stroke();
}

function redrawLines() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  lines.forEach(line => drawRedLine(line.p1, line.p2));
}

avatars.forEach(avatar => {
  avatar.addEventListener('click', () => {
    if (!selected) {
      selected = avatar;
      avatar.classList.add('active');
    } else if (selected === avatar) {
      selected.classList.remove('active');
      selected = null;
    } else {
      const p1 = getCenter(selected);
      const p2 = getCenter(avatar);
      lines.push({ p1, p2 });
      selected.classList.remove('active');
      selected = null;
      redrawLines();
    }
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  lines = [];
  redrawLines();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  lines = [];
  selected = null;
  avatars.forEach(a => a.classList.remove('active'));
  redrawLines();
});

document.getElementById('exportBtn').addEventListener('click', async () => {
  const wrapper = document.querySelector('.wrapper');
  const c = await html2canvas(wrapper, { backgroundColor: '#f5f5f7' });
  const a = document.createElement('a');
  a.download = 'cp-match-red-line.png';
  a.href = c.toDataURL('image/png');
  a.click();
});

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script>

</body>
</html>
